name: Build

on:
  push:
    branches: [trunk]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Fetch dependencies
        run: cmake -S . -B build
      - name: Package
        run: |
          cmake --build build --target package
          cp build/SUWSF.ini dist/SUWSF.ini
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: downloads
          path: |
            dist/*.zip
            dist/*.sha256
            dist/*.ini
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: downloads
          path: dist
      - name: Publish downloads
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          release_flags=()
          if [[ "$RELEASE_TAG" == *-* ]]; then
            release_flags+=(--prerelease --latest=false)
          fi
          gh release create "$RELEASE_TAG" dist/*.zip dist/*.sha256 dist/*.ini \
            --verify-tag --title "$RELEASE_TAG — SUWSF ultrawide" \
            "${release_flags[@]}" \
            --notes 'Fixes Tarot monster-hunt clues being hidden behind the card on ultrawide displays. Keeps the card, clue list and description together in their original layout, verified in-game on Linux/Proton. Existing users can replace SUWSF.ini and restart, preserving any manually configured resolution. Includes all previous map, camera-boundary and 1280×800 menu corrections. Targets Steam build 25766122.'
