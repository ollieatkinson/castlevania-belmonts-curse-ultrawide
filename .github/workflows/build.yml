name: Build

on:
  push:
    branches: [trunk]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Fetch dependencies
        run: cmake -S . -B build
      - name: Package
        run: cmake --build build --target package
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: downloads
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: downloads
          path: dist
      - name: Publish downloads
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          gh release create "$RELEASE_TAG" dist/*.zip dist/*.sha256
          --verify-tag --title "$RELEASE_TAG — SUWSF ultrawide"
          --notes 'Adds correct map and inventory framing at 1280×800 (16:10), while preserving ultrawide gameplay. Existing users can replace SUWSF.ini and restart. For a new install, extract beside the game executable, select Fullscreen Windowed and the highest resolution entry (still labelled 3840×2160). Proton: WINEDLLOVERRIDES="version=n,b" %command%. Verified on Linux/Proton, Steam build 25766122. The reported camera issue on the climb toward the third boss remains under investigation; see the README for limitations.'
